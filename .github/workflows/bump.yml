on:
  push:
  schedule:
    - # ~6am AEST
    - cron: "19 19 * * *"
permissions:
  contents: write # let the action push the commit it made
jobs:
  bump_versions:
    name: Bump Dependency Versions
    runs-on:
      ubuntu-22.04
    steps:
      - name: git checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Nix via Cachix
        if: env.using_self_hosted_runner_with_nix != 'true'
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          install_url: "https://releases.nixos.org/nix/nix-2.34.7/install"
      - name: pull dev environment
        run: |
          nix develop --command \
            echo dev environment ready
      - name: prep git
        run: |
          set -e
          git fetch
          git checkout main
          git config --global user.name 'BumpBot'
          git config --global user.email 'robert.k.bell+bumpbot@gmail.com'
      - name: update deps
        run: |
          nix develop --command \
            ./bin/update
      - name: commit changes
        run: |
          nix develop --command \
            ./bin/commit
      - name: push to origin
        run: git push
